trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- script: echo Hello, world!
  displayName: 'Run a one-line script'

- script: |
    echo Add other tasks to build, test, and deploy your project.
    echo See https://aka.ms/yaml
  displayName: 'Run a multi-line script'

- script: |
    curl -s -o /dev/null -w "%{http_code}" \
      -X POST \
      -H "Content-Type: application/json" \
      -H "X-Automation-Webhook-Token: $(JIRA_WEBHOOK_SECRET)" \
      -d '{
        "data": {
          "buildStatus": "$(Agent.JobStatus)",
          "buildNumber": "$(Build.BuildNumber)",
          "branch": "$(Build.SourceBranchName)",
          "repository": "$(Build.Repository.Name)",
          "buildUrl": "$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
        }
      }' \
      "https://api-private.atlassian.com/automation/webhooks/jira/a/5c526d11-e6f7-4c8c-95b8-df2481e855bf/019dd3c9-05db-719b-bfe1-5eb22b5554ff"
  displayName: 'Notify Jira automation'
  condition: always()
  env:
    JIRA_WEBHOOK_SECRET: $(JIRA_WEBHOOK_SECRET)
